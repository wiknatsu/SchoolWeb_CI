; PHP settings for production (Hostinger / hPanel compatible)
; Update values as needed and set an absolute error_log path on the server

; Turn off error display to users
display_errors = Off
log_errors = On
; Set error log to an absolute writable path on the server (update before use)
; Example: /home/username/public_html/writable/logs/php-errors.log
; error_log = /absolute/path/to/writable/logs/php-errors.log

; Memory and execution tuning
memory_limit = 256M
max_execution_time = 60

; OPcache (recommended to enable in production)
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
; If you want automatic file changes detection set to 1 (slower); 0 is faster but
; requires opcache reset on deploy. Choose based on your deploy process.
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Adjust to your needs. Some providers don't allow changing all of these via .user.ini.
